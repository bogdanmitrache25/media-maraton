<style>
:root{
  --bg:#0b0f14; --bg2:#131a23; --bg3:#1b242f; --line:#243040;
  --tx:#e8eef6; --tx2:#93a4b8; --tx3:#5f7288;
  --acc:#22d3ee;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--tx);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}

/* ---------- layout ---------- */
#app{display:flex;flex-direction:column;height:100%;overflow:hidden}
header{
  padding:calc(var(--safe-t) + 12px) 16px 12px;background:var(--bg);
  border-bottom:1px solid var(--line);flex:none;
}
.hd-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hd-title{font-size:17px;font-weight:700;letter-spacing:-.2px}
.hd-sub{font-size:12px;color:var(--tx2);margin-top:2px}
.hd-goal{font-size:12px;color:var(--acc);font-weight:700;white-space:nowrap}
.bar{height:5px;border-radius:3px;background:var(--bg3);margin-top:11px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#22d3ee,#22c55e);transition:width .35s}
.bar-lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);margin-top:5px}

main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px calc(18px + var(--safe-b))}
.view{display:none}.view.on{display:block}

nav{
  flex:none;display:flex;z-index:5;
  padding:6px 8px calc(6px + var(--safe-b));
  background:var(--bg2);border-top:1px solid var(--line);
}
nav button{flex:1;padding:7px 2px;border-radius:12px;font-size:10.5px;color:var(--tx3);font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button b{font-size:19px;font-weight:400;line-height:1}
nav button.on{color:var(--acc);background:rgba(34,211,238,.09)}

/* ---------- cards ---------- */
.card{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:-.2px}
.muted{color:var(--tx2);font-size:13.5px}
.tiny{font-size:12px;color:var(--tx3)}

.phase-h{display:flex;align-items:center;gap:9px;margin:22px 4px 10px;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.phase-h i{width:9px;height:9px;border-radius:50%;flex:none}
.phase-h span{color:var(--tx2);font-weight:600;text-transform:none;letter-spacing:0;font-size:12px}

.wk{background:var(--bg2);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.wk-h{display:flex;align-items:center;gap:11px;padding:13px 14px}
.wk-h:active{background:var(--bg3)}
.wk-num{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--bg3)}
.wk-mid{flex:1;min-width:0}
.wk-t{font-size:14.5px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-s{font-size:11.5px;color:var(--tx3);margin-top:2px}
.wk-km{font-size:12px;font-weight:700;color:var(--tx2);white-space:nowrap}
.chk{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line);flex:none;transition:.2s}
.wk.done .chk{background:#22c55e;border-color:#22c55e}
.wk.done .wk-t{color:var(--tx2)}
.wk.open .wk-km{color:var(--acc)}
.wk-b{display:none;border-top:1px solid var(--line)}
.wk.open .wk-b{display:block}
.note{margin:10px 14px;padding:10px 12px;border-radius:11px;background:rgba(34,211,238,.07);border:1px solid rgba(34,211,238,.18);font-size:12.5px;color:#b9e8f4}
.note.warn{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.22);color:#f5cf95}
.d{display:flex;gap:11px;padding:11px 14px;border-top:1px solid rgba(36,48,64,.6)}
.d:first-child{border-top:0}
.d-bar{width:3px;border-radius:2px;flex:none;background:var(--tx3)}
.d-main{flex:1;min-width:0}
.d-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.d-day{font-size:11.5px;font-weight:800;color:var(--tx3);width:30px;flex:none;text-transform:uppercase}
.d-ttl{font-size:14px;font-weight:600;letter-spacing:-.2px}
.d-desc{font-size:12.5px;color:var(--tx2);margin-top:3px}
.d-cap{font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:2px 7px;border-radius:6px;flex:none}
.d.today{background:rgba(34,211,238,.06)}
.d.today .d-day{color:var(--acc)}
.d .box{width:26px;height:26px;flex:none;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:14px;color:transparent;margin-top:-2px}
.d.ck .box{background:#22c55e;border-color:#22c55e;color:#04210f}
.d-lock .box{opacity:.25}
.d-lock{opacity:.45}

.tA{background:rgba(249,115,22,.16);color:#fdba74}
.tB{background:rgba(239,68,68,.16);color:#fca5a5}
.tC{background:rgba(6,182,212,.14);color:#67e8f9}
.tG{background:rgba(139,92,246,.16);color:#c4b5fd}
.tR{background:rgba(148,163,184,.12);color:#94a3b8}
.tT{background:rgba(234,179,8,.16);color:#fde047}
.tZ{background:rgba(34,197,94,.16);color:#86efac}

.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--bg3);color:var(--tx2);margin:0 6px 6px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid rgba(36,48,64,.7)}
th{color:var(--tx3);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:700}
.acc{border-left:3px solid var(--line);padding-left:11px;margin:12px 0}
.acc b{display:block;font-size:13.5px;margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11.5px;color:var(--tx3);font-weight:700;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
#acwrOut{font-size:30px;font-weight:800;letter-spacing:-1px}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.legend i{font-style:normal;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.big{font-size:15px;font-weight:650}
ul.clean{margin:6px 0;padding-left:0;list-style:none}
ul.clean li{padding:7px 0 7px 22px;position:relative;font-size:13.5px;color:var(--tx2);border-bottom:1px solid rgba(36,48,64,.5)}
ul.clean li:last-child{border-bottom:0}
ul.clean li:before{content:"";position:absolute;left:6px;top:14px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
ul.clean li b{color:var(--tx)}
</style>
</head>

const KEY="mm150_state_v1";
let S = JSON.parse(localStorage.getItem(KEY) || '{"done":{},"log":{}}');
if(!S.done) S.done={}; if(!S.log) S.log={};
const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const iso=d=>d.toISOString().slice(0,10);
const TODAY=iso(new Date());
const parse=s=>new Date(s+"T12:00:00");

const dateRange=(s)=>{
  const a=parse(s), b=new Date(a.getTime()+6*864e5);
  const f=d=>d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}).replace(/\./g,"");
  return f(a)+" – "+f(b);
};
const weekEnd=w=>iso(new Date(parse(w.s).getTime()+6*864e5));

// acciones contables: todo lo que no es descanso puro
const countable=t=>t!=="R";
const weekTotal=w=>w.d.filter(([t])=>countable(t)).length;
const weekDone=w=>w.d.filter(([t],i)=>countable(t)&&S.done[w.n+"-"+i]).length;

/* =========================================================
   RENDER · PLAN
   ========================================================= */
function renderPlan(){
  let h="";
  Object.keys(PHASES).map(Number).forEach(p=>{
    const ph=PHASES[p], ws=W.filter(w=>w.p===p);
    if(!ws.length) return;
    h+=`<div class="phase-h"><i style="background:${ph.c}"></i>${ph.n}<span>${ph.w}</span></div>`;
    ws.forEach(w=>{
      const tot=weekTotal(w), dn=weekDone(w);
      const complete=dn===tot&&tot>0;
      h+=`<div class="wk ${complete?"done":""}" data-w="${w.n}">
        <div class="wk-h">
          <div class="wk-num" style="color:${ph.c}">S${w.n}</div>
          <div class="wk-mid">
            <div class="wk-t">${w.f}</div>
            <div class="wk-s">${dateRange(w.s)} · ${dn}/${tot} sesiones${w.test?" · 🔬 TEST":""}${w.race?" · 🏁":""}</div>
          </div>
          <div class="wk-km">${w.km}</div>
          <div class="chk"></div>
        </div>
        <div class="wk-b">
          ${w.note?`<div class="note ${w.warn?"warn":""}">${w.warn?"⚠️ ":"🎯 "}${w.note}</div>`:""}
          ${w.d.map(([t,ttl,desc],i)=>{
            const T=TYPES[t], key=w.n+"-"+i, on=S.done[key]?"ck":"", lock=countable(t)?"":"d-lock";
            const isToday=dateOf(w.n,i)===TODAY?"today":"";
            return `<div class="d ${on} ${lock} ${isToday}" data-k="${key}">
              <div class="d-bar" style="background:${T.bar}"></div>
              <div class="d-day">${DAYN[i]}</div>
              <div class="d-main">
                <div class="d-top"><span class="d-cap ${T.cls}">${T.lbl}</span><span class="d-ttl">${ttl}</span></div>
                ${desc?`<div class="d-desc">${desc}</div>`:""}
              </div>
              <div class="box">✓</div>
            </div>`;
          }).join("")}
        </div>
      </div>`;
    });
  });
  document.getElementById("v-plan").innerHTML=h;
}

const dateOf=(weekN,dayIdx)=>{
  const w=W.find(x=>x.n===weekN); if(!w) return "";
  const d=parse(w.s); d.setDate(d.getDate()+dayIdx); return iso(d);
};

function renderReg(){
  const opts=W.map(w=>`<option value="${w.n}">S${w.n} · ${dateRange(w.s)}</option>`).join("");
  document.getElementById("v-reg").innerHTML=`
  <div class="card">

      <div class="fld"><label>Semana −3</label><input id="a2" type="number" inputmode="decimal" placeholder="km"></div>
      <div class="fld"><label>Semana −2</label><input id="a3" type="number" inputmode="decimal" placeholder="km"></div>
      <div class="fld"><label>Semana −1</label><input id="a4" type="number" inputmode="decimal" placeholder="km"></div>
    </div>
    <div class="fld"><label>Semana actual</label><input id="ac" type="number" inputmode="decimal" placeholder="km"></div>
    <button id="calc" style="width:100%;padding:13px;border-radius:12px;background:var(--acc);color:#04212b;font-weight:800">Calcular ACWR</button>
    <div id="acwrOut" style="margin-top:14px;text-align:center;color:var(--tx3)">—</div>
    <div id="acwrMsg" class="tiny" style="text-align:center;margin-top:4px"></div>
  </div>

  <div class="card">
    <h3>📝 Cierre de semana</h3>
    <div class="fld"><label>Semana</label><select id="lw">${opts}</select></div>
    <div class="grid2">
      <div class="fld"><label>Km totales</label><input id="lkm" type="number" inputmode="decimal"></div>
      <div class="fld"><label>Dolor máx (0-10)</label><input id="ldol" type="number" inputmode="numeric"></div>
      <div class="fld"><label>Cadencia (ppm)</label><input id="lcad" type="number" inputmode="numeric"></div>
      <div class="fld"><label>Sueño medio (h)</label><input id="lsue" type="number" inputmode="decimal" step="0.1"></div>
      <div class="fld"><label>Palpación tibia D (cm)</label><input id="lpd" type="number" inputmode="decimal" step="0.5"></div>
      <div class="fld"><label>Palpación tibia I (cm)</label><input id="lpi" type="number" inputmode="decimal" step="0.5"></div>
    </div>
    <div class="fld"><label>Notas</label><input id="lno" type="text" placeholder="Cómo ha ido la semana"></div>
    <button id="saveLog" style="width:100%;padding:13px;border-radius:12px;background:var(--bg3);font-weight:800;border:1px solid var(--line)">Guardar semana</button>
    <div id="logMsg" class="tiny" style="text-align:center;margin-top:8px"></div>
  </div>

  <div class="card">
    <h3>📚 Historial</h3>
    <div id="hist" class="muted">Sin registros todavía.</div>
  </div>

  <div class="card">
    <h3>⚙️ Datos</h3>
    <div class="tiny" style="margin-bottom:10px">Todo se guarda solo en este dispositivo (localStorage). Nada sale de tu iPhone.</div>
    <button id="reset" style="width:100%;padding:12px;border-radius:12px;background:rgba(239,68,68,.12);color:#fca5a5;font-weight:700;border:1px solid rgba(239,68,68,.3)">Borrar todo el progreso</button>
  </div>`;

  // ACWR
  const calc=()=>{
    const v=[1,2,3,4].map(i=>parseFloat(document.getElementById("a"+i).value)).filter(x=>!isNaN(x));
    const cur=parseFloat(document.getElementById("ac").value);
    const out=document.getElementById("acwrOut"), msg=document.getElementById("acwrMsg");
    if(v.length<1||isNaN(cur)){out.textContent="—";out.style.color="var(--tx3)";msg.textContent="";return;}
    const avg=v.reduce((a,b)=>a+b,0)/v.length;
    if(avg===0){out.textContent="—";msg.textContent="Las semanas previas no pueden ser 0.";return;}
    const r=cur/avg;
    out.textContent=r.toFixed(2);
    let c,t;
    if(r<0.8){c="#60a5fa";t="Infraentrenamiento. Puedes subir.";}
    else if(r<=1.3){c="#22c55e";t="Zona segura. Adelante.";}
    else if(r<=1.5){c="#eab308";t="Riesgo elevado. NO subas esta semana.";}
    else{c="#ef4444";t="Zona de lesión. Repite o baja el volumen.";}
    out.style.color=c; msg.innerHTML=`<span style="color:${c};font-weight:700">${t}</span>`;
    const wk=document.getElementById("lw");
    if(wk) wk.dataset.acwr=r.toFixed(2);
  };
  ["a1","a2","a3","a4","ac"].forEach(id=>document.getElementById(id).addEventListener("input",calc));
  document.getElementById("calc").addEventListener("click",calc);

  // log
  const sel=document.getElementById("lw");
  const fill=n=>{

    document.getElementById("ldol").value=L.dol??"";
    document.getElementById("lcad").value=L.cad??"";
    document.getElementById("lsue").value=L.sue??"";
    document.getElementById("lpd").value=L.pd??"";
    document.getElementById("lpi").value=L.pi??"";
    document.getElementById("lno").value=L.no??"";
  };
  sel.addEventListener("change",()=>fill(sel.value));
  const cur=W.find(w=>w.s<=TODAY && TODAY<=weekEnd(w)) || W[0];
  sel.value=cur.n; fill(cur.n);

  document.getElementById("saveLog").addEventListener("click",()=>{
    const n=sel.value;
    S.log[n]={
      km:document.getElementById("lkm").value,
      dol:document.getElementById("ldol").value,
      cad:document.getElementById("lcad").value,
      sue:document.getElementById("lsue").value,
      pd:document.getElementById("lpd").value,
      pi:document.getElementById("lpi").value,
      no:document.getElementById("lno").value,
      acwr:sel.dataset.acwr||""
    };
    save();
    document.getElementById("logMsg").innerHTML='<span style="color:#22c55e;font-weight:700">✓ Guardado</span>';
    hist();
    setTimeout(()=>document.getElementById("logMsg").textContent="",1800);
  });

  document.getElementById("reset").addEventListener("click",()=>{
    if(confirm("¿Borrar todo el progreso y los registros? No se puede deshacer.")){
      S={done:{},log:{}}; save(); location.reload();
    }
  });

  hist();
}

function hist(){
  const rows=Object.keys(S.log).map(Number).sort((a,b)=>a-b)
    .filter(n=>Object.values(S.log[n]).some(v=>v!==""))
    .map(n=>{
      const L=S.log[n];
      return `<tr><td><b>S${n}</b></td><td>${L.km||"—"} km</td><td>${L.dol!==""&&L.dol!=null?L.dol:"—"}/10</td><td>${L.cad||"—"}</td><td>${L.pd||"—"}/${L.pi||"—"}</td><td>${L.acwr||"—"}</td></tr>`;
    });
  document.getElementById("hist").innerHTML = rows.length
    ? `<table><tr><th>Sem</th><th>Km</th><th>Dolor</th><th>Cad</th><th>Palp</th><th>ACWR</th></tr>${rows.join("")}</table>`
    : "Sin registros todavía.";
}

/* =========================================================
   INTERACCIÓN
   ========================================================= */
function attach(){
  document.querySelectorAll("nav button").forEach(b=>{
    b.addEventListener("click",()=>{
      document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
      document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      document.getElementById("v-"+b.dataset.v).classList.add("on");
      document.querySelector("main").scrollTop=0;
    });
  });
}

/* Delegación global: actualiza en sitio, sin re-render */
document.body.addEventListener("click",e=>{
  const h=e.target.closest(".wk-h");
  if(h && h.parentElement && h.parentElement.classList.contains("wk")){
    h.parentElement.classList.toggle("open");
    return;
  }
  const d=e.target.closest(".d[data-k]");
  if(!d || d.classList.contains("d-lock")) return;
  const k=d.dataset.k;
  const wn=parseInt(k.split("-")[0],10);
  if(S.done[k]) delete S.done[k]; else S.done[k]=true;
  save();
  document.querySelectorAll('.d[data-k="'+k+'"]').forEach(x=>x.classList.toggle("ck",!!S.done[k]));
  const w=W.find(x=>x.n===wn);
  if(w){
    const dn=weekDone(w), tot=weekTotal(w);
    const card=document.querySelector('.wk[data-w="'+wn+'"]');
    if(card){
      card.classList.toggle("done", tot>0 && dn===tot);
      const s=card.querySelector(".wk-s");
      if(s) s.textContent=dateRange(w.s)+" · "+dn+"/"+tot+" sesiones"+(w.test?" · 🔬 TEST":"")+(w.race?" · 🏁":"");
    }
  }
  upd();
});

function upd(){
  let tot=0,dn=0;
  W.forEach(w=>{ tot+=weekTotal(w); dn+=weekDone(w); });
  const p=tot?Math.round(dn/tot*100):0;
  document.getElementById("pbar").style.width=p+"%";
  document.getElementById("pTxt").textContent=p+" % completado";
  document.getElementById("pSes").textContent=dn+"/"+tot+" sesiones";
}

/* =========================================================
   GO
   ========================================================= */
renderPlan(); renderHoy(); renderPre(); renderReg();
attach(); upd();
</script>
</body>
</html>
